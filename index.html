<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xbox Revolución · Recuperación GitHub/Render</title>
  <style>
    :root{color-scheme:dark;--bg:#090b0d;--card:#13171b;--line:#283038;--text:#f2f5f7;--muted:#9ba7b1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif;padding:28px}
    .wrap{max-width:1000px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
    h1{margin:0 0 8px;font-size:26px} h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}
    .ok{color:var(--green)} .warn{color:var(--yellow)} .bad{color:var(--red)}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--green);color:#061109;margin:5px 8px 5px 0}
    button.secondary{background:#26313a;color:white}.row{display:flex;gap:12px;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
    code{background:#0a0e11;padding:2px 6px;border-radius:5px;word-break:break-all}.big{font-size:18px;font-weight:700}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Recuperación de almacenamiento web</h1>
    <p class="muted">Esta página <b>solo lee</b> el localStorage del origen donde está publicada. No usa Firebase, no hace fetch y no modifica datos.</p>
    <div id="origin" class="big"></div>
    <p id="originHelp"></p>
    <div class="row">
      <button onclick="exportAll()">Exportar TODO el localStorage</button>
      <button class="secondary" onclick="scan()">Volver a analizar</button>
    </div>
  </div>

  <div class="card">
    <h2>Copias detectadas</h2>
    <div id="summary" class="muted">Analizando…</div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Clave</th><th>Guardado</th><th>Historial</th><th>Primero</th><th>Último</th><th>Equipos</th><th>Empleados</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Todas las claves del origen</h2>
    <div id="keys" class="muted"></div>
  </div>
</div>

<script>
function safeJSON(raw){ try{return JSON.parse(raw)}catch(e){return null} }
function findDB(obj, depth=0){
  if(!obj || typeof obj!=="object" || depth>5) return null;
  if(Array.isArray(obj.history) || obj.devices || obj.employees) return obj;
  if(obj.db && typeof obj.db==="object") {
    const x=findDB(obj.db, depth+1); if(x) return x;
  }
  if(obj.xbox_rev_db && typeof obj.xbox_rev_db==="object") {
    const x=findDB(obj.xbox_rev_db, depth+1); if(x) return x;
  }
  for(const v of Object.values(obj)){
    if(v && typeof v==="object" && !Array.isArray(v)){
      const x=findDB(v, depth+1); if(x) return x;
    }
  }
  return null;
}
function asArray(v){ return Array.isArray(v)?v:(v&&typeof v==="object"?Object.values(v):[]) }
function fmtMs(ms){
  if(!ms) return "—";
  const d=new Date(Number(ms)); return isNaN(d)?String(ms):d.toLocaleString();
}
function analyze(key, raw){
  const obj=safeJSON(raw);
  if(!obj) return {key, savedAt:null, history:0, first:"—", last:"—", devices:0, employees:0, raw};
  const db=findDB(obj);
  if(!db) return {key, savedAt:obj.savedAt||null, history:0, first:"—", last:"—", devices:0, employees:0, raw};
  const hist=asArray(db.history);
  const times=hist.map(x=>x&&x.timestamp).filter(Boolean).sort();
  return {
    key,
    savedAt:obj.savedAt || db.savedAt || null,
    history:hist.length,
    first:times[0]||"—",
    last:times[times.length-1]||"—",
    devices:asArray(db.devices).length,
    employees:asArray(db.employees).length,
    raw
  };
}
function scan(){
  const originEl=document.getElementById("origin");
  const help=document.getElementById("originHelp");
  originEl.textContent="Origen actual: "+location.origin;
  if(location.protocol==="file:"){
    originEl.className="big bad";
    help.innerHTML='<span class="bad"><b>NO sirve para recuperar GitHub desde file://.</b></span> Sube este archivo al mismo dominio de GitHub Pages/Render que usabas y ábrelo desde esa URL.';
  } else {
    originEl.className="big ok";
    help.innerHTML='<span class="ok"><b>Origen web correcto.</b></span> Si este es el mismo dominio que usabas para el panel, aquí veremos sus copias locales.';
  }

  const all=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    all.push(analyze(key, localStorage.getItem(key)));
  }
  all.sort((a,b)=>(b.history-a.history)||((b.savedAt||0)-(a.savedAt||0)));

  document.getElementById("summary").innerHTML = all.length
    ? `Se encontraron <b>${all.length}</b> claves. La tabla pone primero las que contienen más historial.`
    : '<span class="warn"><b>No hay claves en localStorage para este origen/perfil.</b></span>';

  document.getElementById("rows").innerHTML=all.map(x=>`
    <tr>
      <td><code>${esc(x.key)}</code></td>
      <td>${esc(fmtMs(x.savedAt))}</td>
      <td><b>${x.history}</b></td>
      <td>${esc(x.first)}</td>
      <td>${esc(x.last)}</td>
      <td>${x.devices}</td>
      <td>${x.employees}</td>
    </tr>`).join("");

  document.getElementById("keys").innerHTML = all.length
    ? all.map(x=>`<div><code>${esc(x.key)}</code></div>`).join("")
    : "Sin datos.";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function exportAll(){
  const entries={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    entries[k]=localStorage.getItem(k);
  }
  const payload={
    exportedAt:new Date().toISOString(),
    origin:location.origin,
    href:location.href,
    entries
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="xbox_rev_WEB_localStorage_COMPLETO.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
scan();
</script>
</body>
</html>
